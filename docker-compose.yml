services:
  dufs:
    image: sigoden/dufs:v0.47.0
    container_name: fortress-dufs
    user: "0:0"
    environment:
      DUFS_SERVE_PATH: /data
      DUFS_BIND: 0.0.0.0
      DUFS_PORT: "5000"
      DUFS_AUTH: "admin:${DUFS_ADMIN_PASSWORD_HASH:?set DUFS_ADMIN_PASSWORD_HASH in .env}@/:rw"
      DUFS_ALLOW_ALL: "true"
      DUFS_HIDDEN: ".*"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8443:5000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m

  vaultwarden:
    image: vaultwarden/server:1.37.5
    container_name: fortress-vaultwarden
    environment:
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?set VAULTWARDEN_ADMIN_TOKEN in .env}
      DOMAIN: ${VAULTWARDEN_DOMAIN:?set VAULTWARDEN_DOMAIN in .env}
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      WEBSOCKET_ENABLED: "true"
    volumes:
      - vaultwarden_data:/data
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m

  authelia:
    image: authelia/authelia:4.39.28
    container_name: fortress-authelia
    restart: unless-stopped
    user: "1000:1000"
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?set in .env}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?set in .env}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?set in .env}
      AUTHELIA_LOG_LEVEL: info
    volumes:
      - ./authelia:/config
    ports:
      - "127.0.0.1:9091:9091"
    mem_limit: 256m
    memswap_limit: 256m
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.9
    container_name: fortress-caddy
    restart: unless-stopped
    environment:
      DUFS_ADMIN_BASIC: ${DUFS_ADMIN_BASIC:?set in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/logs:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:8090:8090"
    mem_limit: 64m
    memswap_limit: 64m
    security_opt:
      - no-new-privileges:true

volumes:
  vaultwarden_data:
  caddy_data:
  caddy_config:
