theme: light
session:
  name: authelia_session
  same_site: lax
  inactivity: 30m
  expiration: 1h
  remember_me: 1M
  cookies:
    - domain: ${AUTHELIA_HOSTNAME}
      authelia_url: https://${AUTHELIA_HOSTNAME}:9091
      default_redirection_url: https://${AUTHELIA_HOSTNAME}:3000
authentication_backend:
  file:
    path: /config/users_database.yml
storage:
  local:
    path: /config/db.sqlite3
notifier:
  filesystem:
    filename: /config/notification.txt
access_control:
  default_policy: one_factor
regulation:
  modes: [ip]
  max_retries: 5
  find_time: 2m
  ban_time: 10m
log:
  level: info
